server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/account_db
  kafka:
    bootstrap-servers: kafka:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
          issuer-uri: http://keycloak:8080/realms/banking

banking:
  redis:
    enabled: true
    host: redis
