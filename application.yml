# Shared configuration for ALL services (served by config-server).
# Secrets are NEVER here; they arrive as environment variables.

spring:
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  # Boot 4 property (was management.otlp.tracing.endpoint in Boot 3).
  # The transport property must be set explicitly or the OTLP exporter bean is not created.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    # traceId/spanId are injected automatically by Micrometer Tracing (no manual plumbing).
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.banking: INFO
